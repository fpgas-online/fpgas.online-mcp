[project]
name = "fpgas-online-mcp"
dynamic = ["version"]
description = "Claude Code plugin with a skill for using the boards on fpgas.online"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.1",
]

[project.scripts]
fpgas-online-mcp = "fpgas_online_mcp.mcp_server:main"
fpgas-online-broker = "fpgas_online_mcp.broker:main"
fpgas-online = "fpgas_online_mcp.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version comes from `git describe` (build_version.py): every commit on main gets its own.
[tool.hatch.version]
source = "code"
path = "build_version.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/skills", "/build_version.py", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/fpgas_online_mcp"]

# The stage 1 skill text, read by the guide tool (fpgas_online_mcp/guide.py).
[tool.hatch.build.targets.wheel.force-include]
"skills/fpgas-online" = "fpgas_online_mcp/skill"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Rebuild the editable install when the commit or tags change, so the version stays current.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "build_version.py" }, { git = { commit = true, tags = true } }]
