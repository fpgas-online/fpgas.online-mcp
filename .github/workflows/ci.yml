name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the version comes from `git describe` (build_version.py).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -v
      - run: uv build
      - name: Check the built version
        run: uv run --no-project python scripts/check_dist.py dist

  # Every push to main is published to PyPI as <X>.<Y>.<commits since the v<X>.<Y> tag>.
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing; no API token is stored anywhere
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: false # the job that can publish never restores a cache
      - run: uv build
      - run: uv run --no-project python scripts/check_dist.py dist
      # Each push publishes its own version, so parallel runs never collide; --check-url skips files
      # PyPI already has (a re-run of a published commit).
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
